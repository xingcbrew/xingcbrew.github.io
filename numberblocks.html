<title>Numberblock Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EEF0FF; --surface: #FFFFFF; --surface2: #E4E7FF;
  --border: #C8CEFF; --text: #1A1A3E; --text-muted: #6B6FA8;
  --accent: #5B52E8; --accent-h: #4840D6;
  --success: #10B981; --warn: #F59E0B; --danger: #EF4444;
  --cell-empty: #E8EBFF; --cell-line: #CDD1F5;
  --shadow: 0 2px 10px rgba(91,82,232,.13);
  --ff-d: 'Fredoka One','Nunito',sans-serif;
  --ff-b: 'Nunito',sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0D0F2A;--surface:#161937;--surface2:#1F2452;--border:#2E3370;
    --text:#E6E9FF;--text-muted:#8B90C8;--accent:#7870F8;--accent-h:#6C64F0;
    --cell-empty:#181B40;--cell-line:#252860;--shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg:#0D0F2A;--surface:#161937;--surface2:#1F2452;--border:#2E3370;
  --text:#E6E9FF;--text-muted:#8B90C8;--accent:#7870F8;--accent-h:#6C64F0;
  --cell-empty:#181B40;--cell-line:#252860;--shadow:0 2px 10px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--ff-b);background:var(--bg);color:var(--text);overflow:hidden;user-select:none;-webkit-user-select:none;}
.screen{display:none;width:100%;height:100%;}
.screen.active{display:flex;}

/* START */
#start-screen{flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px 20px;text-align:center;overflow-y:auto;}
.logo-blocks{display:flex;gap:6px;justify-content:center;}
.logo-block{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--ff-d);font-size:20px;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.22);}
.start-title{font-family:var(--ff-d);font-size:clamp(30px,8vw,60px);line-height:1.1;text-wrap:balance;}
.start-sub{font-size:16px;color:var(--text-muted);font-weight:700;margin-top:6px;}
.mode-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;}
.mode-btn{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 32px;background:var(--surface);border:3px solid var(--border);border-radius:20px;cursor:pointer;font-family:var(--ff-d);font-size:20px;color:var(--text);transition:border-color .15s,transform .15s,box-shadow .15s;min-width:160px;box-shadow:var(--shadow);}
.mode-btn:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 6px 20px rgba(91,82,232,.22);}
.mode-btn .em{font-size:40px;}
#op-picker{display:none;flex-direction:column;align-items:center;gap:16px;background:var(--surface);border:2px solid var(--border);border-radius:20px;padding:24px;box-shadow:var(--shadow);}
#op-picker h3{font-family:var(--ff-d);font-size:20px;}
.op-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.op-btn{padding:12px 18px;border:3px solid var(--border);border-radius:12px;background:var(--surface2);font-family:var(--ff-d);font-size:18px;cursor:pointer;color:var(--text);transition:all .12s;min-width:72px;}
.op-btn:hover,.op-btn.sel{border-color:var(--accent);background:var(--accent);color:#fff;}
.go-btn{padding:14px 44px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-family:var(--ff-d);font-size:20px;cursor:pointer;transition:background .12s,transform .12s;box-shadow:0 4px 16px rgba(91,82,232,.35);}
.go-btn:hover{background:var(--accent-h);transform:translateY(-1px);}

/* GAME */
#game-screen{flex-direction:column;overflow:hidden;}
#math-banner{display:none;background:var(--accent);color:#fff;padding:10px 20px;text-align:center;font-family:var(--ff-d);font-size:clamp(18px,4.5vw,28px);flex-shrink:0;}
#live-count{display:none;background:var(--surface2);padding:5px 12px;text-align:center;flex-shrink:0;border-bottom:1px solid var(--border);}
#live-count-txt{font-family:var(--ff-d);font-size:clamp(14px,3vw,19px);color:var(--accent);}
.game-body{flex:1;display:flex;overflow:hidden;}
#grid-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden;}
#grid{display:grid;grid-template-columns:repeat(10,1fr);border:2px solid var(--border);border-radius:4px;overflow:hidden;box-shadow:var(--shadow);touch-action:none;cursor:crosshair;}
.cell{position:relative;border-right:1px solid var(--cell-line);border-bottom:1px solid var(--cell-line);background:var(--cell-empty);overflow:hidden;transition:filter .05s;}
.cell:hover{filter:brightness(.88);}
.cell.colored{border-color:rgba(0,0,0,.12);}
.cell-eyes{position:absolute;left:0;right:0;top:8%;height:50%;}
.cell-eyes svg{width:100%;height:100%;overflow:visible;}
.cell-mouth{position:absolute;left:0;right:0;top:58%;height:38%;}
.cell-mouth svg{width:100%;height:100%;overflow:visible;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.cell.shake{animation:shake .35s ease;}

/* PANEL */
#panel{width:252px;min-width:210px;background:var(--surface);border-left:2px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
.tabs{display:flex;border-bottom:2px solid var(--border);flex-shrink:0;}
.tab{flex:1;padding:12px 6px;background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:var(--ff-d);font-size:16px;cursor:pointer;color:var(--text-muted);transition:color .12s,border-color .12s;}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);}
.panel-inner{flex:1;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;}
#color-panel,#face-panel{display:none;flex-direction:column;gap:11px;}
#color-panel.on,#face-panel.on{display:flex;}
.lbl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.swatch{aspect-ratio:1;border-radius:7px;border:2px solid transparent;cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.14);}
.swatch:hover{transform:scale(1.14);}
.swatch.on{border-color:var(--text)!important;transform:scale(1.2);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 4px 12px rgba(0,0,0,.28);}
.tools{display:flex;gap:6px;}
.tool-btn{flex:1;padding:8px 4px;border:2px solid var(--border);border-radius:9px;background:var(--surface2);font-family:var(--ff-b);font-weight:700;font-size:13px;cursor:pointer;color:var(--text);transition:all .12s;display:flex;align-items:center;justify-content:center;gap:4px;}
.tool-btn:hover{border-color:var(--accent);}
.tool-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.acts{display:flex;flex-direction:column;gap:6px;}
.act-btn{padding:9px 12px;border:2px solid var(--border);border-radius:9px;background:var(--surface2);font-family:var(--ff-b);font-weight:700;font-size:13px;cursor:pointer;color:var(--text);transition:all .12s;display:flex;align-items:center;gap:7px;}
.act-btn:hover{border-color:var(--accent);}
.act-btn.dng:hover{border-color:var(--danger);color:var(--danger);}
.face-swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.face-sw{aspect-ratio:1;border:3px solid var(--border);border-radius:9px;cursor:pointer;background:var(--surface2);display:flex;align-items:center;justify-content:center;padding:3px;transition:all .12s;overflow:hidden;}
.face-sw svg{width:100%;height:100%;overflow:visible;}
.face-sw:hover{border-color:var(--accent);transform:scale(1.06);}
.face-sw.on{border-color:var(--accent);background:rgba(91,82,232,.15);}
.face-hint{font-size:11px;font-weight:700;color:var(--text-muted);text-align:center;padding:6px;background:var(--surface2);border-radius:8px;line-height:1.4;}
#done-btn{margin:11px;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-family:var(--ff-d);font-size:20px;cursor:pointer;transition:background .12s,transform .12s;box-shadow:0 4px 14px rgba(91,82,232,.35);flex-shrink:0;}
#done-btn:hover{background:var(--accent-h);transform:translateY(-1px);}

/* TOAST */
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(12px);background:rgba(26,26,62,.92);color:#fff;padding:8px 16px;border-radius:22px;font-family:var(--ff-b);font-weight:700;font-size:13px;pointer-events:none;opacity:0;transition:opacity .22s,transform .22s;z-index:200;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* CONFIRM MODAL */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;align-items:center;justify-content:center;}
#modal.show{display:flex;}
.modal-box{background:var(--surface);border-radius:18px;padding:26px 30px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:18px;max-width:280px;}
.modal-box p{font-family:var(--ff-d);font-size:18px;}
.modal-row{display:flex;gap:12px;justify-content:center;}

/* DONE */
#done-screen{flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 16px;overflow-y:auto;}
#free-count{display:none;font-family:var(--ff-d);font-size:clamp(22px,5vw,36px);color:var(--accent);text-align:center;}
#char-wrap{display:flex;align-items:center;justify-content:center;flex:1;min-height:0;}
@keyframes popIn{0%{transform:scale(.4);opacity:0;}70%{transform:scale(1.07);}100%{transform:scale(1);opacity:1;}}
@keyframes bob{0%,100%{transform:scale(1) rotate(-2deg);}50%{transform:scale(1.08) rotate(2deg);}}
#char-grid{position:relative;display:inline-block;animation:popIn .55s cubic-bezier(.34,1.56,.64,1) both;}
#char-grid.bob{animation:bob .55s ease-in-out 4;}
.dc{position:absolute;box-sizing:border-box;border:2px solid rgba(0,0,0,.18);overflow:hidden;}
.dc-eyes{position:absolute;left:0;right:0;top:8%;height:50%;}
.dc-eyes svg{width:100%;height:100%;overflow:visible;}
.dc-mouth{position:absolute;left:0;right:0;top:58%;height:38%;}
.dc-mouth svg{width:100%;height:100%;overflow:visible;}
#math-res{display:none;flex-direction:column;align-items:center;gap:6px;}
.done-eq{font-family:var(--ff-d);font-size:clamp(18px,4vw,26px);color:var(--text-muted);}
.count-txt{font-family:var(--ff-d);font-size:clamp(26px,6vw,48px);color:var(--accent);}
.res-msg{font-family:var(--ff-d);font-size:clamp(20px,4.5vw,32px);}
.res-msg.ok{color:var(--success);}
.res-msg.no{color:var(--warn);}
.done-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.d-btn{padding:12px 22px;border-radius:12px;font-family:var(--ff-d);font-size:17px;cursor:pointer;transition:all .12s;border:3px solid transparent;}
.d-btn.pri{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(91,82,232,.3);}
.d-btn.pri:hover{background:var(--accent-h);transform:translateY(-1px);}
.d-btn.sec{background:var(--surface);color:var(--text);border-color:var(--border);}
.d-btn.sec:hover{border-color:var(--accent);}
.conf{position:fixed;border-radius:2px;pointer-events:none;z-index:999;animation:fall linear forwards;}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(800deg);opacity:0;}}
@media (max-width:680px){.game-body{flex-direction:column;}#panel{width:100%;min-width:0;border-left:none;border-top:2px solid var(--border);max-height:290px;}}
@media (max-width:400px){.mode-row{flex-direction:column;}.mode-btn{min-width:0;width:100%;}}
</style>

<div id="start-screen" class="screen active">
  <div>
    <div class="logo-blocks">
      <div class="logo-block" style="background:#DE151D">1</div>
      <div class="logo-block" style="background:#E89223">2</div>
      <div class="logo-block" style="background:#E6C40C">3</div>
      <div class="logo-block" style="background:#38B500">4</div>
      <div class="logo-block" style="background:#23B0DB">5</div>
    </div>
    <h1 class="start-title">Numberblock<br>Builder</h1>
    <p class="start-sub">Build blocky characters &amp; solve math!</p>
  </div>
  <div class="mode-row">
    <button class="mode-btn" id="free-btn"><span class="em">🎨</span>Free Build</button>
    <button class="mode-btn" id="math-btn"><span class="em" style="font-size:32px;letter-spacing:-1px;line-height:1">+×÷</span>Math Challenge</button>
  </div>
  <div id="op-picker">
    <h3>Choose an operation:</h3>
    <div class="op-row">
      <button class="op-btn" data-op="add">+ Add</button>
      <button class="op-btn" data-op="subtract">− Subtract</button>
      <button class="op-btn" data-op="multiply">× Multiply</button>
      <button class="op-btn" data-op="divide">÷ Divide</button>
      <button class="op-btn" data-op="mix">🎲 Mix</button>
    </div>
    <button class="go-btn" id="go-btn">Let's Go! 🚀</button>
  </div>
</div>

<div id="game-screen" class="screen">
  <div id="math-banner"></div>
  <div id="live-count"><span id="live-count-txt">0 blocks</span></div>
  <div class="game-body">
    <div id="grid-wrap"><div id="grid"></div></div>
    <div id="panel">
      <div class="tabs">
        <button class="tab on" id="t-color">🎨 Color</button>
        <button class="tab" id="t-face">😊 Face</button>
      </div>
      <div class="panel-inner">
        <div id="color-panel" class="on">
          <div class="lbl">Numberblocks Colors</div>
          <div class="swatches" id="swatches"></div>
          <div class="tools">
            <button class="tool-btn on" id="paint-btn">✏️ Paint</button>
            <button class="tool-btn" id="erase-btn">🧹 Erase</button>
          </div>
          <div class="acts">
            <button class="act-btn" id="undo-btn">↩️ Undo</button>
            <button class="act-btn dng" id="clear-btn">🗑️ Clear All</button>
          </div>
        </div>
        <div id="face-panel">
          <div class="lbl">Eyes</div>
          <div class="face-swatches" id="eye-sw"></div>
          <div class="lbl">Mouths</div>
          <div class="face-swatches" id="mouth-sw"></div>
          <div class="face-hint">Tap a colored block to place a face!</div>
        </div>
      </div>
      <button id="done-btn">Done ✓</button>
    </div>
  </div>
</div>

<div id="done-screen" class="screen">
  <div id="free-count"></div>
  <div id="char-wrap"><div id="char-grid"></div></div>
  <div id="math-res">
    <div class="done-eq" id="done-eq"></div>
    <div class="count-txt" id="count-txt"></div>
    <div class="res-msg" id="res-msg"></div>
  </div>
  <div class="done-btns">
    <button class="d-btn sec" id="home-btn">🏠 Home</button>
    <button class="d-btn sec" id="edit-btn">✏️ Edit</button>
    <button class="d-btn pri" id="new-btn">✨ New</button>
    <button class="d-btn pri" id="next-btn" style="display:none">Next Problem ▶</button>
    <button class="d-btn sec" id="free-mode-btn" style="display:none">Free Build 🎨</button>
    <button class="d-btn pri" id="keep-btn" style="display:none">Keep Editing 🔧</button>
  </div>
</div>

<div id="modal">
  <div class="modal-box">
    <p>Clear everything?</p>
    <div class="modal-row">
      <button class="d-btn pri" id="modal-yes">Yes, clear!</button>
      <button class="d-btn sec" id="modal-no">Cancel</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const GS = 10;

const COLORS = [
  {n:'One · Red',      v:'#DE151D'},{n:'Two · Orange',   v:'#E89223'},
  {n:'Three · Yellow', v:'#E6C40C'},{n:'Four · Green',   v:'#38B500'},
  {n:'Five · Cyan',    v:'#23B0DB'},{n:'Six · Indigo',   v:'#5A35C3'},
  {n:'Seven · Violet', v:'#BA79DD'},{n:'Eight · Pink',   v:'#FD40A4'},
  {n:'Nine Lt Grey',   v:'#C4C8CB'},{n:'Nine Md Grey',   v:'#A5A9AC'},
  {n:'Nine Dk Grey',   v:'#8A8B8F'},{n:'White',          v:'#EEEEEE'},
  {n:'Twenty',         v:'#FFECAC'},{n:'Thirty',         v:'#F3EF98'},
  {n:'Forty',          v:'#CDF7B7'},{n:'Fifty',          v:'#9EE6DB'},
  {n:'Sixty',          v:'#8561CF'},{n:'Seventy',        v:'#C298E4'},
  {n:'Eighty',         v:'#FFA398'},{n:'One Hundred',    v:'#FC8A89'},
];

// Eyes — all viewBox="0 0 60 32" unless noted
const EYES = [
  {id:'cyclops',l:'Cyclops',s:`<svg viewBox="0 0 60 38" xmlns="http://www.w3.org/2000/svg">
    <circle cx="30" cy="22" r="14" fill="#DE151D"/>
    <circle cx="30" cy="22" r="11" fill="white"/>
    <circle cx="30" cy="22" r="7" fill="#111"/>
    <circle cx="30" cy="22" r="4" fill="#111"/>
    <circle cx="34" cy="18" r="2.5" fill="white"/>
  </svg>`},

  {id:'double',l:'Round Eyes',s:`<svg viewBox="0 0 60 28" xmlns="http://www.w3.org/2000/svg">
    <circle cx="16" cy="14" r="12" fill="white" stroke="#111" stroke-width="2.5"/>
    <circle cx="44" cy="14" r="12" fill="white" stroke="#111" stroke-width="2.5"/>
    <circle cx="16" cy="15" r="7" fill="#111"/>
    <circle cx="44" cy="15" r="7" fill="#111"/>
    <circle cx="19.5" cy="11.5" r="3" fill="white"/>
    <circle cx="47.5" cy="11.5" r="3" fill="white"/>
  </svg>`},

  {id:'square',l:'Square Eyes',s:`<svg viewBox="0 0 60 28" xmlns="http://www.w3.org/2000/svg">
    <rect x="4" y="3" width="24" height="22" rx="3" fill="#1A1A2E"/>
    <rect x="32" y="3" width="24" height="22" rx="3" fill="#1A1A2E"/>
    <rect x="9" y="7" width="8" height="8" rx="1.5" fill="white"/>
    <rect x="37" y="7" width="8" height="8" rx="1.5" fill="white"/>
  </svg>`},

  {id:'glasses-r',l:'Round Glasses',s:`<svg viewBox="0 0 60 28" xmlns="http://www.w3.org/2000/svg">
    <circle cx="16" cy="14" r="12" fill="rgba(138,82,232,.18)" stroke="#8B52E8" stroke-width="3"/>
    <circle cx="44" cy="14" r="12" fill="rgba(138,82,232,.18)" stroke="#8B52E8" stroke-width="3"/>
    <line x1="28" y1="14" x2="32" y2="14" stroke="#8B52E8" stroke-width="3"/>
    <line x1="4" y1="8" x2="4" y2="14" stroke="#8B52E8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="56" y1="8" x2="56" y2="14" stroke="#8B52E8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="16" cy="15" r="6" fill="#111"/>
    <circle cx="44" cy="15" r="6" fill="#111"/>
    <circle cx="19" cy="12" r="2.5" fill="white"/>
    <circle cx="47" cy="12" r="2.5" fill="white"/>
  </svg>`},

  {id:'glasses-rect',l:'Rect Glasses',s:`<svg viewBox="0 0 60 28" xmlns="http://www.w3.org/2000/svg">
    <rect x="3" y="4" width="25" height="19" rx="3" fill="rgba(138,139,143,.18)" stroke="#8A8B8F" stroke-width="3"/>
    <rect x="32" y="4" width="25" height="19" rx="3" fill="rgba(138,139,143,.18)" stroke="#8A8B8F" stroke-width="3"/>
    <line x1="28" y1="13" x2="32" y2="13" stroke="#8A8B8F" stroke-width="2.5"/>
    <circle cx="15.5" cy="13.5" r="6" fill="#111"/>
    <circle cx="44.5" cy="13.5" r="6" fill="#111"/>
    <circle cx="18.5" cy="11" r="2.5" fill="white"/>
    <circle cx="47.5" cy="11" r="2.5" fill="white"/>
  </svg>`},

  {id:'crown',l:'Spike Eyes',s:`<svg viewBox="0 0 60 36" xmlns="http://www.w3.org/2000/svg">
    <polygon points="9,18 21,18 15,2" fill="#DE151D"/>
    <polygon points="24,18 36,18 30,2" fill="#DE151D"/>
    <polygon points="39,18 51,18 45,2" fill="#DE151D"/>
    <circle cx="18" cy="28" r="8" fill="white" stroke="#111" stroke-width="2"/>
    <circle cx="42" cy="28" r="8" fill="white" stroke="#111" stroke-width="2"/>
    <circle cx="18" cy="29" r="4.5" fill="#111"/>
    <circle cx="42" cy="29" r="4.5" fill="#111"/>
    <circle cx="21" cy="26" r="1.8" fill="white"/>
    <circle cx="45" cy="26" r="1.8" fill="white"/>
  </svg>`},

  {id:'block-brow',l:'Block Brows',s:`<svg viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg">
    <rect x="3" y="1" width="24" height="8" rx="2.5" fill="#38B500"/>

// ── STATE ──
let grid = mkGrid(), selColor = COLORS[0].v, selColorName = COLORS[0].n;
let selFace = null, tool = 'paint', activeTab = 'color';
let hist = [], mode = null, math = null, selOp = null, ptrDown = false;

function mkGrid(){return Array.from({length:GS},()=>Array.from({length:GS},()=>({color:null,eye:null,mouth:null})));}
function coloredCount(){return grid.reduce((s,row)=>s+row.filter(c=>c.color).length,0);}

// ── DOM ──
const $ss=document.getElementById('start-screen');
const $gs=document.getElementById('game-screen');
const $ds=document.getElementById('done-screen');
const $grid=document.getElementById('grid');
const $mb=document.getElementById('math-banner');
const $lc=document.getElementById('live-count');
const $lcTxt=document.getElementById('live-count-txt');
const $swatches=document.getElementById('swatches');
const $eyeSw=document.getElementById('eye-sw');
const $mouthSw=document.getElementById('mouth-sw');
const $toast=document.getElementById('toast');
const $charGrid=document.getElementById('char-grid');
const $mathRes=document.getElementById('math-res');
const $countTxt=document.getElementById('count-txt');
const $resMsg=document.getElementById('res-msg');
const $freeCount=document.getElementById('free-count');
const $modal=document.getElementById('modal');
let cells=[];

// ── INIT PALETTES ──
function initSwatches(){
  $swatches.innerHTML='';
  COLORS.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='swatch'+(i===0?' on':'');
    b.style.background=c.v; b.title=c.n;
    b.addEventListener('click',()=>pickColor(c));
    $swatches.appendChild(b);
  });
}
function initFaceSw(){
  $eyeSw.innerHTML='';
  EYES.forEach(e=>{const b=document.createElement('button');b.className='face-sw';b.innerHTML=e.s;b.title=e.l;b.addEventListener('click',()=>pickFace('eye',e.id,b));$eyeSw.appendChild(b);});
  $mouthSw.innerHTML='';
  MOUTHS.forEach(m=>{const b=document.createElement('button');b.className='face-sw';b.innerHTML=m.s;b.title=m.l;b.addEventListener('click',()=>pickFace('mouth',m.id,b));$mouthSw.appendChild(b);});
}

// ── GRID ──
function buildGrid(){
  $grid.innerHTML=''; cells=[];
  const wrap=document.getElementById('grid-wrap');
  const sz=Math.max(20,Math.floor(Math.min(wrap.clientWidth-24,wrap.clientHeight-24)/GS));
  $grid.style.width=sz*GS+'px'; $grid.style.height=sz*GS+'px';
  $grid.style.gridTemplateColumns=`repeat(${GS},${sz}px)`;
  $grid.style.gridTemplateRows=`repeat(${GS},${sz}px)`;
  for(let r=0;r<GS;r++){cells[r]=[];for(let c=0;c<GS;c++){
    const el=document.createElement('div'); el.className='cell';
    const eo=document.createElement('div'); eo.className='cell-eyes'; el.appendChild(eo);
    const mo=document.createElement('div'); mo.className='cell-mouth'; el.appendChild(mo);
    el.addEventListener('pointerdown',ev=>{ev.preventDefault();ptrDown=true;interact(r,c,true);});
    el.addEventListener('pointerenter',()=>{if(ptrDown)interact(r,c,false);});
    $grid.appendChild(el); cells[r][c]=el;
  }}
  document.addEventListener('pointerup',()=>ptrDown=false);
}
function renderAll(){for(let r=0;r<GS;r++)for(let c=0;c<GS;c++)renderCell(r,c);}
function renderCell(r,c){
  const el=cells[r][c],d=grid[r][c];
  el.style.background=d.color||''; el.classList.toggle('colored',!!d.color);
  el.querySelector('.cell-eyes').innerHTML=d.color&&d.eye?eyeSvg(d.eye):'';
  el.querySelector('.cell-mouth').innerHTML=d.color&&d.mouth?mouthSvg(d.mouth):'';
}
function eyeSvg(id){const e=EYES.find(x=>x.id===id);return e?e.s:'';}
function mouthSvg(id){const m=MOUTHS.find(x=>x.id===id);return m?m.s:'';}

// ── LIVE COUNT ──
function updateLiveCount(){
  const n=coloredCount();
  $lcTxt.textContent=n===1?'1 block':`${n} blocks`;
}

// ── INTERACT ──
function interact(r,c,first){
  if(activeTab==='color'){
    if(tool==='erase'){
      if(grid[r][c].color){push();grid[r][c]={color:null,eye:null,mouth:null};renderCell(r,c);updateLiveCount();}
    } else {
      if(!grid[r][c].color){
        const any=grid.some(row=>row.some(cx=>cx.color));
        if(any&&!adjColor(r,c)){if(first){shake(r,c);toast('Connect it to a block! 🧱');}return;}
        push();grid[r][c].color=selColor;renderCell(r,c);updateLiveCount();
      } else if(grid[r][c].color!==selColor){push();grid[r][c].color=selColor;renderCell(r,c);}
    }
  } else {
    if(!grid[r][c].color){if(first)toast('Color a block first! 🎨');return;}
    if(!selFace){if(first)toast('Pick a face feature! 👆');return;}
    push();
    if(selFace.type==='eye')grid[r][c].eye=selFace.id;
    else grid[r][c].mouth=selFace.id;
    renderCell(r,c);
  }
}
function adjColor(r,c){return(r>0&&grid[r-1][c].color)||(r<GS-1&&grid[r+1][c].color)||(c>0&&grid[r][c-1].color)||(c<GS-1&&grid[r][c+1].color);}
function shake(r,c){const el=cells[r][c];el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');el.addEventListener('animationend',()=>el.classList.remove('shake'),{once:true});}

// ── TOAST ──
let toastT;
function toast(msg){$toast.textContent=msg;$toast.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>$toast.classList.remove('show'),2000);}

// ── HISTORY ──
function push(){hist.push(grid.map(row=>row.map(c=>({...c}))));if(hist.length>60)hist.shift();}
function undo(){if(!hist.length){toast('Nothing to undo!');return;}grid=hist.pop();renderAll();updateLiveCount();}
function clearAll(){$modal.classList.add('show');}
document.getElementById('modal-yes').addEventListener('click',()=>{$modal.classList.remove('show');push();grid=mkGrid();renderAll();updateLiveCount();});
document.getElementById('modal-no').addEventListener('click',()=>$modal.classList.remove('show'));

// ── COLOR & FACE ──
function pickColor(c){
  selColor=c.v; selColorName=c.n;
  document.querySelectorAll('.swatch').forEach((s,i)=>s.classList.toggle('on',COLORS[i].v===c.v));
  tool='paint'; updTools();
}
function updTools(){document.getElementById('paint-btn').classList.toggle('on',tool==='paint');document.getElementById('erase-btn').classList.toggle('on',tool==='erase');}
function pickFace(type,id,btn){selFace={type,id};document.querySelectorAll('.face-sw').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
function switchTab(t){activeTab=t;document.getElementById('t-color').classList.toggle('on',t==='color');document.getElementById('t-face').classList.toggle('on',t==='face');document.getElementById('color-panel').classList.toggle('on',t==='color');document.getElementById('face-panel').classList.toggle('on',t==='face');}

// ── MATH ──
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function genProblem(op){
  if(op==='mix')return genProblem(['add','subtract','multiply','divide'][rand(0,3)]);
  switch(op){
    case 'add':      {const ans=rand(2,50),a=rand(1,ans-1);return{display:`${a} + ${ans-a} = ?`,answer:ans};}
    case 'subtract': {const ans=rand(1,40),b=rand(1,20),a=ans+b;return{display:`${a} − ${b} = ?`,answer:ans};}
    case 'multiply': {const a=rand(1,9),b=rand(1,Math.min(10,Math.floor(50/a)));return{display:`${a} × ${b} = ?`,answer:a*b};}
    case 'divide':   {const d=rand(2,8),ans=rand(1,Math.floor(40/d));return{display:`${ans*d} ÷ ${d} = ?`,answer:ans};}
  }
}

// ── DONE ──
function handleDone(){
  const pts=[];
  for(let r=0;r<GS;r++)for(let c=0;c<GS;c++)if(grid[r][c].color)pts.push({r,c});
  if(!pts.length){toast('Add some color first! 🎨');return;}

  const rs=pts.map(p=>p.r),cs=pts.map(p=>p.c);
  const r0=Math.min(...rs),r1=Math.max(...rs),c0=Math.min(...cs),c1=Math.max(...cs);
  const h=r1-r0+1,w=c1-c0+1;
  const avail=Math.min(window.innerWidth*.72,window.innerHeight*.52);
  const csz=Math.max(20,Math.min(90,Math.floor(avail/Math.max(h,w))));

  // Use absolute positioning — only render colored cells, no white fill
  $charGrid.style.width=(w*csz)+'px';
  $charGrid.style.height=(h*csz)+'px';
  $charGrid.innerHTML='';

  for(let r=r0;r<=r1;r++){
    for(let c=c0;c<=c1;c++){
      const d=grid[r][c];
      if(!d.color) continue; // skip empty — no white filler
      const el=document.createElement('div');
      el.className='dc';
      el.style.left=((c-c0)*csz)+'px';
      el.style.top=((r-r0)*csz)+'px';
      el.style.width=csz+'px';
      el.style.height=csz+'px';
      el.style.background=d.color;
      if(d.eye){const ee=document.createElement('div');ee.className='dc-eyes';ee.innerHTML=eyeSvg(d.eye);el.appendChild(ee);}
      if(d.mouth){const me=document.createElement('div');me.className='dc-mouth';me.innerHTML=mouthSvg(d.mouth);el.appendChild(me);}
      $charGrid.appendChild(el);
    }
  }

  // Re-trigger pop animation
  $charGrid.style.animation='none';void $charGrid.offsetWidth;
  $charGrid.style.animation='popIn .55s cubic-bezier(.34,1.56,.64,1) both';

  showScreen('done');
  $mathRes.style.display='none';
  $freeCount.style.display='none';
  ['edit-btn','new-btn'].forEach(id=>document.getElementById(id).style.display='');
  ['next-btn','free-mode-btn','keep-btn'].forEach(id=>document.getElementById(id).style.display='none');

  const cnt=pts.length;

  if(mode==='free'){
    $freeCount.style.display='block';
    $freeCount.textContent=`${cnt} block${cnt!==1?'s':''}!`;
  }

  if(mode==='math'&&math){
    document.getElementById('done-eq').textContent=math.display;
    $countTxt.textContent=`You built ${cnt} block${cnt!==1?'s':''}!`;
    $mathRes.style.display='flex';
    ['edit-btn','new-btn'].forEach(id=>document.getElementById(id).style.display='none');
    if(cnt===math.answer){
      $resMsg.textContent='Correct! 🎉';$resMsg.className='res-msg ok';
      ['next-btn','free-mode-btn'].forEach(id=>document.getElementById(id).style.display='');
      confetti();$charGrid.classList.add('bob');setTimeout(()=>$charGrid.classList.remove('bob'),2400);
    } else {
      $resMsg.textContent='Not quite — try again! 🤔';$resMsg.className='res-msg no';
      document.getElementById('keep-btn').style.display='';
    }
  }
}

function confetti(){
  const cols=['#DE151D','#E89223','#E6C40C','#38B500','#23B0DB','#5A35C3','#FD40A4'];
  for(let i=0;i<70;i++)setTimeout(()=>{
    const p=document.createElement('div');p.className='conf';
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${cols[rand(0,6)]};width:${8+Math.random()*8}px;height:${8+Math.random()*8}px;border-radius:${Math.random()<.5?'50%':'2px'};animation-duration:${1.5+Math.random()*2}s;`;
    document.body.appendChild(p);setTimeout(()=>p.remove(),4000);
  },i*40);
}

// ── SCREENS ──
function showScreen(s){$ss.classList.toggle('active',s==='start');$gs.classList.toggle('active',s==='game');$ds.classList.toggle('active',s==='done');}
function startGame(m){
  mode=m;grid=mkGrid();hist=[];
  $lc.style.display='block'; $lcTxt.textContent='0 blocks';
  if(m==='math'&&math){$mb.style.display='block';$mb.textContent=math.display;}
  else $mb.style.display='none';
  showScreen('game');buildGrid();renderAll();
}
function goHome(){
  document.getElementById('op-picker').style.display='none';
  document.querySelectorAll('.op-btn').forEach(b=>b.classList.remove('sel'));
  selOp=null; math=null;
  showScreen('start');
}
